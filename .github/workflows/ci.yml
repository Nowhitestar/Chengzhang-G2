name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The tests run the real backend in memory with the simulated AI: no keys, no network.
      - run: npm test
      - run: npm run build
      # Validates the manifest and proves the build packs. The address is a placeholder.
      - run: API_ORIGIN=https://chengzhang-g2.example.com npm run pack
