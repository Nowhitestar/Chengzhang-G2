name: Release

# Builds the app against a deployed backend, packs it as an .ehpk and attaches it to a GitHub release.
# Runs when a tag such as v0.1.0 is pushed, or by hand from the Actions tab (Run workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
      api_origin:
        description: "The backend the packed app talks to"
        required: true
        default: "https://chengzhang-g2-production.up.railway.app"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Pack
        env:
          API_ORIGIN: ${{ inputs.api_origin || vars.API_ORIGIN || 'https://chengzhang-g2-production.up.railway.app' }}
        run: npm run pack
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          API_ORIGIN: ${{ inputs.api_origin || vars.API_ORIGIN || 'https://chengzhang-g2-production.up.railway.app' }}
        run: |
          version=$(node -p "require('./app.json').version")
          file="chengzhang-g2-$version.ehpk"
          mv "chengzhang-$version.ehpk" "$file"
          sed "s#{{API_ORIGIN}}#$API_ORIGIN#g" .github/release-notes.md > notes.md
          gh release create "$TAG" "$file" --target "$GITHUB_SHA" --title "Chengzhang for Even G2 $TAG" --notes-file notes.md
